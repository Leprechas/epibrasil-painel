name: Baixar população municipal IBGE

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "Ano inicial"
        required: true
        default: "2000"
      end_year:
        description: "Ano final"
        required: true
        default: "2025"

permissions:
  contents: write

jobs:
  baixar-populacao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: python -m pip install requests

      - name: Baixar população do IBGE/SIDRA
        run: |
          python scripts/baixar_populacao_ibge.py \
            --start-year "${{ github.event.inputs.start_year }}" \
            --end-year "${{ github.event.inputs.end_year }}" \
            --out "data/populacao_municipio_ano.csv"

      - name: Commit da população baixada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/populacao_municipio_ano.csv
          git commit -m "Atualiza população municipal IBGE" || echo "Sem alterações para commitar"
          git push
