name: Baixar população municipal IBGE

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "Ano inicial"
        required: true
        default: "2000"
      end_year:
        description: "Ano final"
        required: true
        default: "2025"
  schedule:
    # Todo dia 1 às 06:00 UTC. O IBGE/SIDRA publica estimativas anuais
    # (referência 1º de julho), então checagens mensais são suficientes
    # para pegar atualizações/revisões sem sobrecarregar a API.
    - cron: "0 6 1 * *"

permissions:
  contents: write

jobs:
  baixar-populacao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: python -m pip install requests

      - name: Baixar população do IBGE/SIDRA
        run: |
          python scripts/baixar_populacao_ibge.py \
            --start-year "${{ github.event.inputs.start_year || '2000' }}" \
            --end-year "${{ github.event.inputs.end_year || '2026' }}" \
            --out "data/populacao_municipio_ano.csv"

      - name: Verificar se há mudanças
        id: mudou
        run: |
          if git diff --quiet -- data/populacao_municipio_ano.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Atualizar versão de cache
        if: steps.mudou.outputs.changed == 'true'
        run: |
          NOVA_VERSAO=$(date +%Y%m%d)
          sed -i "s/const VERSION=\"[0-9]\{8\}[a-z]*\";/const VERSION=\"${NOVA_VERSAO}\";/" app.js
          sed -i "s/\(style\.css?v=\)[0-9]\{8\}[a-z]*/\1${NOVA_VERSAO}/" index.html
          sed -i "s/\(app\.js?v=\)[0-9]\{8\}[a-z]*/\1${NOVA_VERSAO}/" index.html
          sed -i "s/const CACHE_NAME = \"epibrasil-v[0-9]*\";/const CACHE_NAME = \"epibrasil-v$(date +%s)\";/" sw.js

      - name: Commit da população baixada
        if: steps.mudou.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/populacao_municipio_ano.csv app.js index.html sw.js
          git commit -m "chore: atualiza população municipal IBGE/SIDRA e versão de cache"
          git push
