name: Diagnóstico SINAN (temporário)

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: python -m pip install pysus

      - name: Rodar diagnóstico
        run: python scripts/diagnostico_sinan_dengue.py
